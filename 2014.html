<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>English Exam Practice 2014</title>
<style>
  :root{
    --paper:#FAF6ED; --ink:#2B2A25; --navy:#1E2A44; --navy-soft:#3A4A6B;
    --gold:#B8892B; --gold-text:#85600F; --gold-soft:#EBDDB5;
    --good:#2F6446; --good-bg:#E4EFE6; --bad:#9C3B34; --bad-bg:#F6E4E1;
    --line:#D9CFB8; --card:#FFFFFF;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; scroll-behavior:smooth; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:Georgia,'Times New Roman','Noto Serif Khmer','Khmer OS',serif;
    font-size:16px; line-height:1.6;
    padding-bottom:calc(48px + env(safe-area-inset-bottom));
    overflow-wrap:break-word;
  }
  .khmer{ font-family:'Noto Sans Khmer','Khmer OS Battambang','Leelawadee UI','Khmer UI',sans-serif; }
  header{
    background:var(--navy); color:var(--paper); text-align:center;
    padding:calc(26px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 22px max(18px, env(safe-area-inset-left));
    border-bottom:4px solid var(--gold);
  }
  header .eyebrow{ margin:0 0 6px; font-style:italic; font-size:14px; color:var(--gold-soft); }
  header h1{ margin:0; font-size:clamp(20px,5.5vw,28px); font-weight:normal; line-height:1.25; }
  header p.sub{ margin:8px 0 0; font-size:14px; color:#C9D1E0; }

  .rail{ display:flex; gap:6px; max-width:760px; margin:16px auto 0; padding:0 max(16px, env(safe-area-inset-left)); }
  .rail div{ flex:1; height:5px; background:var(--line); border-radius:3px; overflow:hidden; }
  .rail span{ display:block; height:100%; width:0; background:var(--gold); transition:width .4s ease; }

  .wrap{ max-width:760px; margin:0 auto; padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  section.part{ margin-top:32px; }
  .part-head{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 12px;
    border-bottom:2px solid var(--navy); padding-bottom:6px; margin-bottom:12px; }
  .part-head h2{ margin:0; font-size:clamp(17px,4.6vw,20px); font-weight:normal; color:var(--navy); }
  .pts{ font-size:13px; color:var(--navy-soft); font-style:italic; }
  .instructions{ margin:0 0 14px; font-size:15px; color:var(--navy-soft); }

  /* word bank */
  .bank{ display:flex; flex-wrap:wrap; gap:8px; background:var(--card); border:1px solid var(--line);
    border-radius:6px; padding:12px; margin-bottom:14px; }
  .chip{ font:inherit; font-size:15px; color:var(--navy); background:#F5EFDF; border:1px solid var(--line);
    border-radius:999px; padding:6px 14px; min-height:40px; cursor:pointer; }
  .chip:hover{ border-color:var(--gold); }
  .chip.ex{ cursor:default; background:transparent; border-style:dashed; }
  .chip i{ font-size:12px; }
  .chip.used{ text-decoration:line-through; text-decoration-thickness:2px; text-decoration-color:var(--bad);
    color:#8B8576; background:#EFEBE0; }

  .story{ background:var(--card); border:1px solid var(--line); border-radius:6px; padding:16px 16px; line-height:2.5; font-size:16px; }
  .story h3{ text-align:center; font-size:17px; margin:0 0 6px; color:var(--navy); font-weight:normal; line-height:1.4; }
  .story p{ margin:0 0 10px; }
  .story p:last-child{ margin-bottom:0; }
  .gapwrap{ white-space:nowrap; }
  .gn{ font-size:13px; color:var(--gold-text); margin-right:3px; }
  .exword{ border-bottom:2px solid var(--navy); font-style:italic; font-weight:normal; padding:0 4px; }
  .gap{ font-family:inherit; font-size:16px; color:var(--ink); background:var(--gold-soft);
    border:0; border-bottom:2px solid var(--gold); border-radius:4px 4px 0 0;
    padding:4px 6px; min-height:40px; max-width:100%; margin:0 2px; }
  input.gap{ width:9.5em; }
  select.gap{ width:auto; min-width:6.5em; }
  .gap.correct{ background:var(--good-bg); border-color:var(--good); color:var(--good); }
  .gap.incorrect{ background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }

  /* multiple choice */
  .example-row{ background:#F5EFDF; border:1px dashed var(--line); border-radius:6px; padding:8px 12px; margin:0 0 12px; font-size:15px; }
  .qcard{ background:var(--card); border:1px solid var(--line); border-radius:6px; padding:14px; margin-bottom:12px; }
  .qcard.ok{ border-color:var(--good); } .qcard.bad{ border-color:var(--bad); }
  .qtext{ margin:0 0 10px; font-size:16.5px; }
  .qnum{ color:var(--navy); font-weight:bold; margin-right:6px; }
  .options{ display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,200px),1fr)); gap:8px; }
  label.opt{ position:relative; display:flex; align-items:center; gap:8px; min-height:48px; padding:8px 12px;
    border:1px solid var(--line); border-radius:6px; background:#FFFEFB; cursor:pointer; font-size:16px; }
  label.opt input{ position:absolute; opacity:0; width:1px; height:1px; }
  label.opt .ltr{ flex:none; width:26px; height:26px; border-radius:50%; border:1px solid var(--navy-soft);
    display:inline-flex; align-items:center; justify-content:center; font-size:14px; color:var(--navy); }
  label.opt:hover{ border-color:var(--gold); }
  label.opt.selected{ border-color:var(--navy); background:#EEF1F7; }
  label.opt.selected .ltr{ background:var(--navy); color:#fff; }
  label.opt:focus-within{ outline:3px solid var(--gold); outline-offset:1px; }
  label.opt.correct{ background:var(--good-bg); border-color:var(--good); color:var(--good); font-weight:bold; }
  label.opt.incorrect{ background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
  .qcard.locked label.opt{ cursor:default; }
  .why{ margin-top:12px; padding:10px 12px; border-left:4px solid var(--gold); background:#FBF7EA; border-radius:0 6px 6px 0; font-size:15px; }
  .qcard.ok .why{ border-left-color:var(--good); background:var(--good-bg); }
  .qcard.bad .why{ border-left-color:var(--bad); background:var(--bad-bg); }
  .why p{ margin:0 0 4px; } .why p:last-child{ margin:0; }
  .why .verdict{ font-weight:bold; }

  /* buttons */
  .actions{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:10px; }
  button.btn{ font:inherit; font-size:16px; min-height:48px; padding:10px 20px; border-radius:6px; cursor:pointer;
    background:var(--navy); color:var(--paper); border:1px solid var(--navy); flex:1 1 180px; }
  button.btn:active{ background:var(--navy-soft); }
  button.btn.secondary{ background:transparent; color:var(--navy); flex:0 1 auto; }
  .pill{ font-size:15px; color:var(--navy); font-weight:bold; min-height:22px; flex:1 1 100%; }
  button:focus-visible,.gap:focus-visible,textarea:focus-visible,.chip:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

  /* writing */
  .prompt-box{ background:var(--card); border:1px solid var(--line); border-left:4px solid var(--navy); border-radius:0 6px 6px 0;
    padding:12px 14px; margin-bottom:10px; }
  textarea{ display:block; width:100%; min-height:200px; font-family:inherit; font-size:16px; line-height:1.6; padding:12px;
    border:1px solid var(--line); border-radius:6px; resize:vertical; background:var(--card); color:var(--ink); }
  .wordcount{ font-size:14px; color:var(--navy-soft); margin-top:6px; text-align:right; }
  .wordcount.ok{ color:var(--good); font-weight:bold; }
  .tips{ font-size:14px; color:var(--navy-soft); margin:10px 0 0; padding-left:20px; }

  /* final score */
  .final{ margin-top:36px; background:var(--navy); color:var(--paper); border-radius:8px; padding:22px 18px; text-align:center; }
  .final h2{ margin:0 0 4px; font-weight:normal; font-size:18px; color:var(--gold-soft); }
  .final .score{ font-size:clamp(40px,12vw,56px); line-height:1.15; margin:4px 0 10px; }
  .final .score small{ font-size:.4em; color:#C9D1E0; }
  .final ul{ list-style:none; margin:0 auto; padding:0; max-width:340px; font-size:15px; }
  .final li{ display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px solid rgba(255,255,255,.18); }
  .final .note{ margin:12px 0 0; font-size:13.5px; color:#C9D1E0; }
  .final .btn.secondary{ color:var(--paper); border-color:var(--gold-soft); margin-top:14px; width:100%; max-width:340px; }
  footer{ text-align:center; font-size:13.5px; color:var(--navy-soft); margin-top:26px; }

  @media (max-width:380px){ .story{ padding:12px; } .chip{ padding:6px 12px; } }
  @media (min-width:700px){ .story{ padding:20px 24px; } .qcard{ padding:16px 18px; } }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>

<header>
  <p class="eyebrow ">Exam practice</p>
  <h1>Election English</h1>
  <p class="sub ">Reading · Grammar · Vocabulary — self-check practice</p>
</header>

<div class="rail" aria-hidden="true">
  <div><span id="rail-reading"></span></div>
  <div><span id="rail-grammar"></span></div>
  <div><span id="rail-vocab"></span></div>
</div>

<div class="wrap">

  <section class="part" id="part1">
    <div class="part-head"><h2>Part 1. Reading</h2><span class="pts" id="pts1"></span></div>
    <p class="instructions" id="readInstr"></p>
    <div class="bank" id="bank" aria-label="Word box"></div>
    <div class="story"><h3 id="storyTitle"></h3><div id="passage"></div></div>
    <div class="actions">
      <button class="btn" type="button" id="checkReading">Check Part 1</button>
      <button class="btn secondary" type="button" id="redoReading">Redo</button>
      <div class="pill" id="pill-reading" aria-live="polite"></div>
    </div>
  </section>

  <section class="part" id="part2">
    <div class="part-head"><h2>Part 2. Grammar</h2><span class="pts" id="pts2"></span></div>
    <p class="instructions" id="gramInstr"></p>
    <div id="exGrammar"></div>
    <div id="grammarList"></div>
    <div class="actions">
      <button class="btn" type="button" id="checkGrammar">Check Part 2</button>
      <button class="btn secondary" type="button" id="redoGrammar">Redo</button>
      <div class="pill" id="pill-grammar" aria-live="polite"></div>
    </div>
  </section>

  <section class="part" id="part3">
    <div class="part-head"><h2>Part 3. Vocabulary</h2><span class="pts" id="pts3"></span></div>
    <p class="instructions" id="vocInstr"></p>
    <div id="exVocab"></div>
    <div id="vocabList"></div>
    <div class="actions">
      <button class="btn" type="button" id="checkVocab">Check Part 3</button>
      <button class="btn secondary" type="button" id="redoVocab">Redo</button>
      <div class="pill" id="pill-vocab" aria-live="polite"></div>
    </div>
  </section>

  <section class="part" id="part4">
    <div class="part-head"><h2>Part 4. Writing</h2><span class="pts">10 points</span></div>
    <p class="instructions" id="writeInstr"></p>
    <div class="prompt-box" id="prompt"></div>
    <textarea id="essay" placeholder="Start writing here..." aria-label="Essay"></textarea>
    <div class="wordcount" id="wordcount">0 words</div>
    <ul class="tips" id="tips"></ul>
    <div class="actions">
      <button class="btn" type="button" id="checkWriting">Check Part 4</button>
      <div class="pill" id="pill-writing" aria-live="polite"></div>
    </div>
  </section>

  <div class="final" id="final">
    <h2>Final score</h2>
    <div class="score"><span id="total">0</span> <small>/ <span id="finalMax">40</span></small></div>
    <ul id="breakdown"></ul>
    <p class="note" id="finalNote"></p>
    <button class="btn secondary" type="button" id="resetAll">Start over</button>
  </div>

  <footer class="">Made for self-study practice</footer>
</div>

<script>
(function(){
const E = {"max": {"reading": 10, "grammar": 10, "vocab": 10}, "reading": {"mode": "select", "title": "Elections", "example": "predict", "instr": "Fill each gap with a word or phrase from the box. Gap 1 is done for you. Words you use are crossed out in the box.", "bank": ["candidate", "eligible", "election campaign", "opinion poll", "ballot box", "support", "polling station", "polling day", "result", "winner"], "answers": {"2": "result", "3": "opinion poll", "4": "election campaign", "5": "support", "6": "eligible", "7": "polling station", "8": "polling day", "9": "ballot box", "10": "candidate", "11": "winner"}, "passage": ["People sometimes try to [[ex:1:predict]] the result of an election weeks before it takes place. Several hundred people are asked which party they prefer, and their answers are used to guess the [[2]] of the coming election. This is called an [[3]]. Meanwhile each party conducts its [[4]] with meetings, speeches, television commercials and party members going from door to door encouraging people to [[5]] their party.", "In Cambodia everyone over 18 is [[6]] to vote. The place where people go to vote in an election is called a [[7]] and the day of the election is often known as [[8]]. The voters put their votes in a [[9]] and later they are counted. The [[10]] with the most votes is then declared the [[11]]."]}, "grammar": {"instr": "Choose the correct letter. Each question is worth 2 points. After checking, you will see the reason for each answer.", "qs": [{"q": "Although Ms, Thida ................ reservation, the hotel did not have a room for her.", "opts": ["made", "has made", "had made", "makes"], "ans": 2, "why": "Making the reservation happened <i>before</i> the hotel failed to have a room (both in the past), so the earlier action takes the <b>past perfect</b>: <i>had made</i>."}, {"q": "I .................... on the bus when I dropped my wallet.", "opts": ["am getting", "have gotten", "get", "was getting"], "ans": 3, "why": "A longer action in progress in the past is in the <b>past continuous</b> (<i>was getting</i>), interrupted by a shorter past simple action (<i>dropped</i>)."}, {"q": "Several trees fell down last night ....................... the strong wind.", "opts": ["because of", "since", "because", "so"], "ans": 0, "why": "<i>The strong wind</i> is a noun phrase, so we use <b>because of + noun</b>. <i>Because</i> and <i>since</i> need a full clause, and <i>so</i> introduces a result."}, {"q": "We.................... at that restaurant during the last few months.", "opts": ["don't eat", "won't eat", "haven't eaten", "didn't eat"], "ans": 2, "why": "<i>During the last few months</i> is a period that continues up to now, so we use the <b>present perfect</b>: <i>haven't eaten</i>."}, {"q": "Mr Dara .................. so many accidents if he drove more carefully.", "opts": ["would have", "won't have", "would have had", "wouldn't have"], "ans": 3, "why": "This is the <b>second conditional</b>: <i>if + past simple</i> (drove), then <i>would + base verb</i>. Careful driving means fewer accidents, so the result is negative: <i>wouldn't have</i>."}]}, "vocab": {"instr": "Choose the correct letter. Each question is worth 2 points. After checking, you will see the reason for each answer.", "qs": [{"q": "I'm really .................... of my son who won first prize in the art competition.", "opts": ["pleased", "proud", "delighted", "happy"], "ans": 1, "why": "<b>Proud of</b> someone = feeling pleasure about their achievement. <i>Pleased</i>, <i>delighted</i> and <i>happy</i> are not followed by <i>of</i>."}, {"q": "We all need to .................. responsibility for improving our local community.", "opts": ["have", "make", "take", "give"], "ans": 2, "why": "<b>Take responsibility (for)</b> is the fixed collocation meaning to accept a duty or blame."}, {"q": "It's important to set yourself clear .................. so you know what you are aiming for.", "opts": ["ambitions", "opportunities", "decisions", "goals"], "ans": 3, "why": "We <b>set goals</b>, meaning clear targets we aim for. <i>Ambitions</i> are general wishes (we <i>have</i> them), and <i>opportunities</i> and <i>decisions</i> are not things we set."}, {"q": "According to the weather ...................., there will be rain tomorrow.", "opts": ["programme", "information", "survey", "forecast"], "ans": 3, "why": "A <b>weather forecast</b> is a fixed expression meaning a prediction of future weather."}, {"q": "Many people believe that violent computer games can have a harmful .................. on children.", "opts": ["effect", "affect", "damage", "involvement"], "ans": 0, "why": "<b>Effect</b> is the noun meaning a result, and the phrase is <i>have an effect on</i>. <i>Affect</i> is a verb."}]}, "writing": null};
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const LET = ['a','b','c','d'];
const MAX = Object.assign({reading:10, grammar:15, vocab:15}, E.max||{});
const MINW = E.minWords || 80;
const FINAL_MAX = MAX.reading + MAX.grammar + MAX.vocab;
const GI = 'Only one answer is correct. Choose the correct letter. After checking, you will see the reason for each answer.';
$('#pts1').textContent = MAX.reading + ' points';
$('#pts2').textContent = MAX.grammar + ' points';
$('#pts3').textContent = MAX.vocab + ' points';
$('#gramInstr').textContent = E.grammar.instr || GI;
$('#vocInstr').textContent = E.vocab.instr || GI;
$('#finalMax').textContent = FINAL_MAX;
$('#finalNote').textContent = E.writing ? 'Reading + Grammar + Vocabulary. Writing is not included.' : 'Reading + Grammar + Vocabulary.';
if(!E.writing){ $('#part4').remove(); }
const NAME = {reading:'Reading', grammar:'Grammar', vocab:'Vocabulary'};
const scores = {reading:null, grammar:null, vocab:null};

/* ---------- final score (Reading + Grammar + Vocabulary only) ---------- */
function updateFinal(){
  let total = 0, done = 0;
  Object.keys(scores).forEach(k=>{
    const rail = $('#rail-'+k);
    if(scores[k] === null){ rail.style.width = '0%'; return; }
    total += scores[k]; done++;
    rail.style.width = Math.round(scores[k]/MAX[k]*100) + '%';
  });
  $('#total').textContent = total;
  $('#breakdown').innerHTML = Object.keys(scores).map(k =>
    `<li><span>${NAME[k]}</span><b>${scores[k]===null ? 'not checked' : scores[k] + ' / ' + MAX[k]}</b></li>`).join('');
}

/* ---------- Part 1: reading ---------- */
const R = E.reading;
$('#readInstr').textContent = R.instr;
$('#storyTitle').textContent = R.title;
$('#bank').innerHTML =
  `<span class="chip ex used">${esc(R.example)} <i>(example)</i></span>` +
  R.bank.map(w=>`<button type="button" class="chip" data-word="${esc(w)}">${esc(w)}</button>`).join('');

function gapHTML(n){
  if(R.mode === 'type'){
    return `<span class="gapwrap"><span class="gn">(${n})</span><input class="gap" type="text" data-n="${n}" maxlength="14" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Gap ${n}"></span>`;
  }
  const opts = R.bank.slice().sort().map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('');
  return `<span class="gapwrap"><span class="gn">(${n})</span><select class="gap" data-n="${n}" aria-label="Gap ${n}"><option value="">&mdash;</option>${opts}</select></span>`;
}
$('#passage').innerHTML = R.passage.map(p =>
  '<p>' + p.replace(/\[\[ex:(\d+):([^\]]+)\]\]/g, (m,n,w)=>`<span class="gapwrap"><span class="gn">(${n})</span><b class="exword">${w}</b></span>`)
           .replace(/\[\[(\d+)\]\]/g, (m,n)=>gapHTML(n)) + '</p>').join('');

const gaps = $$('.gap');
function refreshBank(){
const used = new Set(gaps.map(g=>g.value.trim().toLowerCase()).filter(Boolean));
  $$('#bank .chip[data-word]').forEach(c=>c.classList.toggle('used', used.has(c.dataset.word.toLowerCase())));
}
gaps.forEach(g=>{
  const on = ()=>{ g.classList.remove('correct','incorrect'); refreshBank(); };
  g.addEventListener('input', on); g.addEventListener('change', on);
});
$('#bank').addEventListener('click', e=>{
  const chip = e.target.closest('.chip[data-word]');
  if(!chip || chip.classList.contains('used')) return;
  const empty = gaps.find(g=>!g.value.trim());
  if(!empty) return;
  empty.value = chip.dataset.word;
  empty.dispatchEvent(new Event('change'));
});
$('#checkReading').addEventListener('click', ()=>{
  let c = 0;
  gaps.forEach(g=>{
    g.classList.remove('correct','incorrect');
    if(g.value.trim().toLowerCase() === R.answers[g.dataset.n]){ g.classList.add('correct'); c++; }
    else g.classList.add('incorrect');
  });
  scores.reading = c * (MAX.reading / gaps.length);
  $('#pill-reading').textContent = `Part 1: ${c} / ${gaps.length} correct`;
  updateFinal();
});
function redoReading(){
  gaps.forEach(g=>{ g.value=''; g.classList.remove('correct','incorrect'); });
  scores.reading = null; $('#pill-reading').textContent = ''; refreshBank(); updateFinal();
}
$('#redoReading').addEventListener('click', redoReading);

/* ---------- Parts 2 & 3: multiple choice with reasons ---------- */
function buildMCQ(key){
  const D = E[key];
  if(D.example) $('#' + (key==='grammar'?'exGrammar':'exVocab')).innerHTML = `<div class="example-row">${D.example}</div>`;
  $('#'+key+'List').innerHTML = D.qs.map((q,i)=>`
    <div class="qcard">
      <p class="qtext"><span class="qnum">${i+1}.</span>${q.q}</p>
      <div class="options" role="radiogroup" aria-label="Question ${i+1}">
        ${q.opts.map((o,j)=>`<label class="opt"><input type="radio" name="${key}${i}" value="${j}"><span class="ltr">${LET[j]}</span><span>${esc(o)}</span></label>`).join('')}
      </div>
      <div class="why" hidden></div>
    </div>`).join('');
  $$('#'+key+'List .qcard').forEach(card=>{
    card.addEventListener('change', ()=>{
      $$('.opt',card).forEach(o=>o.classList.toggle('selected', o.querySelector('input').checked));
    });
  });
}
function checkMCQ(key){
  const qs = E[key].qs; let c = 0;
  $$('#'+key+'List .qcard').forEach((card,i)=>{
    const q = qs[i], opts = $$('.opt',card);
    const chosen = card.querySelector('input:checked');
    const si = chosen ? +chosen.value : -1;
    card.classList.remove('ok','bad'); card.classList.add('locked');
    opts.forEach(o=>o.classList.remove('correct','incorrect','selected'));
    opts[q.ans].classList.add('correct');
    let verdict;
    if(si === q.ans){ c++; card.classList.add('ok'); verdict = 'Correct!'; }
    else if(si >= 0){ opts[si].classList.add('incorrect'); card.classList.add('bad'); verdict = `Not correct. You chose ${LET[si]}. ${esc(q.opts[si])}`; }
    else { card.classList.add('bad'); verdict = 'No answer chosen.'; }
    const why = $('.why',card);
    why.hidden = false;
    why.innerHTML = `<p class="verdict">${verdict}</p><p><b>Answer: ${LET[q.ans]}. ${esc(q.opts[q.ans])}</b></p><p>${q.why}</p>`;
    $$('input',card).forEach(x=>x.disabled = true);
  });
  const per = MAX[key] / qs.length;
  scores[key] = c * per;
  $('#pill-'+key).textContent = `Part ${key==='grammar'?2:3}: ${c} / ${qs.length} correct (${c*per} / ${MAX[key]} points)`;
  updateFinal();
}
function redoMCQ(key){
  $$('#'+key+'List .qcard').forEach(card=>{
    card.classList.remove('ok','bad','locked');
    $$('.opt',card).forEach(o=>o.classList.remove('correct','incorrect','selected'));
    $$('input',card).forEach(x=>{ x.checked=false; x.disabled=false; });
    const why = $('.why',card); why.hidden = true; why.innerHTML = '';
  });
  scores[key] = null; $('#pill-'+key).textContent = ''; updateFinal();
}
buildMCQ('grammar'); buildMCQ('vocab');
$('#checkGrammar').addEventListener('click', ()=>checkMCQ('grammar'));
$('#checkVocab').addEventListener('click', ()=>checkMCQ('vocab'));
$('#redoGrammar').addEventListener('click', ()=>redoMCQ('grammar'));
$('#redoVocab').addEventListener('click', ()=>redoMCQ('vocab'));

/* ---------- Part 4: writing (not scored) ---------- */
const essay = E.writing ? $('#essay') : null;
function words(){ const t = essay.value.trim(); return t ? t.split(/\s+/).length : 0; }
function showCount(){
  const n = words(), wc = $('#wordcount');
  wc.textContent = n + (n===1?' word':' words') + (n>=MINW ? ' \u2014 minimum reached' : ` \u2014 ${MINW-n} more needed`);
  wc.classList.toggle('ok', n>=MINW);
}
if(E.writing){
  $('#writeInstr').textContent = `Write at least ${MINW} words. This part is not auto-marked and is not counted in the final score.`;
  $('#prompt').innerHTML = E.writing.prompt;
  $('#tips').innerHTML = (E.writing.tips||[]).map(t=>`<li>${t}</li>`).join('');
  essay.addEventListener('input', showCount);
  $('#checkWriting').addEventListener('click', ()=>{
    const n = words();
    $('#pill-writing').textContent = n>=MINW ? `${n} words \u2014 length requirement met. Read it over for grammar and spelling.`
                                           : `${n} words \u2014 you need at least ${MINW-n} more.`;
  });
}

/* ---------- start over ---------- */
$('#resetAll').addEventListener('click', ()=>{
  redoReading(); redoMCQ('grammar'); redoMCQ('vocab');
  if(E.writing){ essay.value=''; showCount(); $('#pill-writing').textContent=''; }
  window.scrollTo({top:0, behavior:'smooth'});
});

refreshBank(); if(E.writing) showCount(); updateFinal();
})();
</script>
